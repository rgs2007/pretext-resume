<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader Layout Unit Tests</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #f6f4ea;
            color: #20201d;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            margin-bottom: 16px;
            font-size: 22px;
        }

        #results {
            display: grid;
            gap: 8px;
            max-width: 720px;
        }

        .pass,
        .fail {
            padding: 10px 12px;
            border-radius: 4px;
        }

        .pass {
            background: #e3efe0;
        }

        .fail {
            background: #f3ded8;
        }

    </style>
</head>
<body>
    <h1>Reader Layout Unit Tests</h1>
    <div id="results">Running...</div>

    <script src="../reader-layout.js"></script>
    <script>
        const results = document.getElementById('results');
        const tests = [];

        function test(name, assertion) {
            tests.push({ name, assertion });
        }

        function assertEqual(actual, expected) {
            if (actual !== expected) {
                throw new Error(`Expected ${expected}, received ${actual}`);
            }
        }

        function assertIncludes(actual, expected) {
            if (!actual.includes(expected)) {
                throw new Error(`Expected "${actual}" to include "${expected}"`);
            }
        }

        function render(resultsByTest) {
            results.replaceChildren(...resultsByTest.map((result) => {
                const row = document.createElement('div');
                row.className = result.pass ? 'pass' : 'fail';
                row.textContent = result.pass
                    ? `PASS: ${result.name}`
                    : `FAIL: ${result.name} - ${result.message}`;
                return row;
            }));
        }

        function run() {
            const { ReaderLayout } = window;

            if (!ReaderLayout) {
                throw new Error('ReaderLayout test API did not load.');
            }

            test('clamps zoom index at the lower bound', () => {
                assertEqual(ReaderLayout.getNextSizeIndex(0, -1), 0);
            });

            test('clamps zoom index at the upper bound', () => {
                assertEqual(ReaderLayout.getNextSizeIndex(7, 1), 7);
            });

            test('increments zoom index inside bounds', () => {
                assertEqual(ReaderLayout.getNextSizeIndex(2, 1), 3);
            });

            test('formats zoom percentage from the 20px base size', () => {
                assertEqual(ReaderLayout.getZoomPercent(24), 120);
            });

            test('keeps reading progress inside Kindle footer bounds', () => {
                assertEqual(ReaderLayout.getProgressPercent(0), 12);
                assertEqual(ReaderLayout.getProgressPercent(30), 96);
            });

            test('formats layout stats consistently', () => {
                assertEqual(ReaderLayout.formatLayoutStats(3, 95.6), '3 lines / 96px');
            });

            test('builds a pretext-compatible reader font string', () => {
                assertIncludes(ReaderLayout.getReaderFont(22), '22px Georgia');
            });

            render(tests.map(({ name, assertion }) => {
                try {
                    assertion();
                    return { name, pass: true };
                } catch (error) {
                    return { name, pass: false, message: error.message };
                }
            }));
        }

        try {
            run();
        } catch (error) {
            render([{ name: 'test harness', pass: false, message: error.message }]);
        }
    </script>
</body>
</html>
