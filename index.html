<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretext Resume - Kindle View</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;

            /* Shared colors keep the browser frame and e-ink reading surface consistent. */
            --ink: #20201d;
            --soft-ink: #55534c;
            --paper: #e8e5d8;
            --paper-dark: #d5d0bf;
            --shadow: rgba(51, 49, 42, 0.16);

            /* JavaScript updates --reader-size when the user presses the Aa controls. */
            --reader-size: 20px;
            --reader-leading: 1.62;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            /* The whole browser page is now the e-ink surface, with no surrounding frame. */
            background:
                linear-gradient(rgba(32, 32, 29, 0.035) 1px, transparent 1px),
                radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.5), transparent 18rem),
                linear-gradient(180deg, #f2efe2 0%, var(--paper) 55%, var(--paper-dark) 100%);
            background-size: 100% 4px, auto, auto;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            overflow: hidden;
        }

        .kindle {
            /* The wrapper now fills the viewport so the product is the screen itself. */
            width: 100vw;
            height: 100vh;
        }

        .screen {
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
            /* No card, border, or shadow: this element is just the page layout grid. */
            background: transparent;
            overflow: hidden;
            position: relative;
        }

        .screen::after {
            /* The click ripple is a temporary water-like surface highlight over the e-ink page. */
            content: "";
            position: absolute;
            left: var(--ripple-x, 50%);
            top: var(--ripple-y, 50%);
            width: 96px;
            height: 96px;
            border: 1px solid rgba(255, 255, 255, 0.36);
            border-radius: 999px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.22);
            box-shadow:
                0 0 0 5px rgba(255, 255, 255, 0.12),
                0 0 0 11px rgba(32, 32, 29, 0.04),
                0 0 22px rgba(255, 255, 255, 0.28),
                inset 0 0 16px rgba(255, 255, 255, 0.2),
                inset 0 0 28px rgba(32, 32, 29, 0.08);
            mix-blend-mode: overlay;
        }

        .screen-rippling::after {
            animation: surfaceRipple 820ms ease-out both;
        }

        .status-bar,
        .reading-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--soft-ink);
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(10px, 1.6vw, 13px);
            letter-spacing: 0;
        }

        .status-bar {
            padding: 18px clamp(22px, 5vw, 72px) 10px;
            border-bottom: 1px solid rgba(69, 67, 59, 0.2);
        }

        .status-title {
            min-width: 116px;
        }

        .type-controls {
            /* The Aa cluster mimics Kindle text settings while staying keyboard-accessible. */
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 3px 6px;
            border: 1px solid rgba(85, 83, 76, 0.26);
            border-radius: 4px;
            background: rgba(232, 229, 216, 0.38);
        }

        .footer-pagination {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .footer-pagination button,
        .type-controls button {
            width: 28px;
            height: 26px;
            border: 0;
            border-radius: 3px;
            background: transparent;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            cursor: pointer;
        }

        .footer-pagination button {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
        }

        .footer-pagination button {
            width: 34px;
            height: 30px;
            border: 1px solid rgba(85, 83, 76, 0.22);
            border-radius: 999px;
            background: rgba(242, 239, 226, 0.58);
        }

        .footer-pagination button:hover,
        .footer-pagination button:focus-visible,
        .type-controls button:hover,
        .type-controls button:focus-visible {
            outline: 1px solid rgba(32, 32, 29, 0.34);
            background: rgba(85, 83, 76, 0.12);
        }

        .footer-pagination button:disabled,
        .type-controls button:disabled {
            color: rgba(85, 83, 76, 0.34);
            cursor: default;
        }

        .zoom-out {
            font-size: 14px;
        }

        .zoom-in {
            font-size: 22px;
            line-height: 1;
        }

        .zoom-value {
            min-width: 40px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            color: var(--soft-ink);
        }

        .page {
            padding: clamp(24px, 4vw, 44px) clamp(22px, 8vw, 96px) clamp(12px, 2vw, 22px);
            overflow: hidden;
            min-height: 0;
            position: relative;
        }

        .eyebrow {
            margin-bottom: 20px;
            color: var(--soft-ink);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 18ch;
            font-size: clamp(38px, 6vw, 68px);
            line-height: 0.98;
            font-weight: 700;
            letter-spacing: 0;
        }

        .subtitle {
            max-width: 58ch;
            margin-top: 14px;
            color: #37352f;
            /* The subtitle scales with the reader text so the page zoom feels unified. */
            font-size: calc(var(--reader-size) + 2px);
            line-height: 1.32;
        }

        .reader-copy {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: clamp(32px, 6vw, 84px);
            height: clamp(320px, 48vh, 520px);
            max-width: 100%;
            margin-top: clamp(16px, 3vw, 28px);
            overflow: hidden;
            color: #2b2a25;
            font-size: var(--reader-size);
            line-height: var(--reader-leading);
            position: relative;
        }

        .reader-line {
            position: absolute;
            left: 0;
            white-space: pre;
            z-index: 1;
            transform: translate3d(0, 0, 0);
            transition:
                transform 540ms cubic-bezier(0.16, 1, 0.3, 1),
                opacity 260ms ease,
                filter 260ms ease;
            transition-delay: var(--part-delay, 0ms);
        }

        .reader-inline-prompt {
            position: absolute;
            top: 6px;
            left: 50%;
            display: grid;
            gap: 10px;
            padding: 16px 24px 18px;
            border: 1px solid rgba(175, 28, 44, 0.52);
            color: #ff354d;
            font-family: "Orbitron", Arial, Helvetica, sans-serif;
            font-size: 22px;
            line-height: 1.18;
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 112, 124, 0.22), rgba(255, 112, 124, 0) 66%),
                rgba(255, 243, 245, 0.16);
            box-shadow:
                0 0 28px rgba(255, 74, 98, 0.16),
                inset 0 0 18px rgba(255, 74, 98, 0.06);
            text-shadow:
                0 0 10px rgba(255, 79, 109, 0.2),
                0 0 18px rgba(255, 79, 109, 0.12);
            filter: brightness(1.18);
            transform: translate(-50%, -16px) scale(0.94);
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            transition: opacity 260ms ease, transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reader-inline-prompt::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 72, 96, 0.7);
            transform: translate(-18px, -50%);
        }

        .reader-inline-prompt::after {
            content: "";
            position: absolute;
            right: 0;
            top: 50%;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 72, 96, 0.42);
            transform: translate(18px, -50%);
        }

        .reader-inline-prompt-visible {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        .reader-inline-prompt strong {
            font-family: "Orbitron", Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255, 53, 77, 0.8);
            justify-self: center;
        }

        .reader-inline-prompt span {
            color: #ff354d;
            text-align: center;
            text-wrap: balance;
        }

        .reader-line-parted {
            opacity: 0.94;
            filter: blur(0.15px);
        }

        .reader-word {
            display: inline-block;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        .reader-word-text {
            display: inline-block;
            will-change: filter, text-shadow;
            transform: translate3d(var(--camera-shift-x, 0px), var(--camera-shift-y, 0px), 0);
            transition: color 90ms linear, text-shadow 90ms linear, filter 90ms linear, transform 110ms ease-out;
        }

        .reader-word-camera-lit .reader-word-text {
            color: var(--camera-word-color, #20201d);
            filter: brightness(var(--camera-word-brightness, 1)) contrast(var(--camera-word-contrast, 1)) saturate(0.92);
            text-shadow:
                0 -1px 0 rgba(255, 255, 255, var(--camera-word-highlight, 0)),
                0 1px 1px rgba(32, 32, 29, var(--camera-word-shadow, 0)),
                0 0 10px rgba(255, 255, 255, var(--camera-word-glow, 0));
        }

        .reader-word-wobble {
            animation: liquidWordWobble 820ms cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: var(--wobble-delay, 0ms);
        }

        .reader-word-text-reflect {
            animation: liquidWordReflect 840ms ease-out both;
            animation-delay: var(--wobble-delay, 0ms);
        }

        .reader-column {
            position: relative;
            min-width: 0;
            height: 100%;
            overflow: hidden;
        }

        .reader-line-heading {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--soft-ink);
        }

        .reader-line-role {
            font-weight: 700;
            color: #26241f;
        }

        .reader-line-contact,
        .reader-line-meta {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.78em;
            color: var(--soft-ink);
        }

        .cursor-line {
            display: inline-block;
            width: 0.58em;
            height: 0.08em;
            margin-left: 0.14em;
            background: var(--ink);
            vertical-align: baseline;
            animation: blink 1.5s steps(2, start) infinite;
        }

        .reading-footer {
            display: grid;
            grid-template-columns: minmax(150px, 0.8fr) minmax(220px, 1.4fr) minmax(150px, 0.8fr);
            gap: 18px;
            padding: 10px clamp(22px, 5vw, 72px) 16px;
            border-top: 1px solid rgba(69, 67, 59, 0.18);
        }

        .page-status {
            display: grid;
            gap: 3px;
            min-width: 140px;
        }

        .page-status strong {
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
        }

        .page-status span {
            color: var(--soft-ink);
            font-size: 11px;
        }

        .layout-stats {
            min-width: 150px;
            text-align: right;
        }

        .progress {
            width: 100%;
            height: 3px;
            border-radius: 999px;
            background: rgba(85, 83, 76, 0.28);
            overflow: hidden;
        }

        .footer-progress {
            display: grid;
            align-items: center;
            gap: 7px;
        }

        .wheel-hint {
            color: var(--soft-ink);
            font-size: 11px;
            text-align: center;
        }

        .progress span {
            display: block;
            /* JavaScript writes --progress after pretext.js reports the new line count. */
            width: var(--progress, 18%);
            height: 100%;
            background: var(--soft-ink);
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @keyframes surfaceRipple {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2);
            }

            18% {
                opacity: 0.68;
                box-shadow:
                    0 0 0 4px rgba(255, 255, 255, 0.22),
                    0 0 0 10px rgba(32, 32, 29, 0.06),
                    0 0 20px rgba(255, 255, 255, 0.36),
                    inset 0 0 18px rgba(255, 255, 255, 0.22),
                    inset 0 0 28px rgba(32, 32, 29, 0.08);
            }

            58% {
                opacity: 0.26;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(4.8);
            }
        }

        @keyframes liquidWordWobble {
            0% {
                transform: translate3d(0, 0, 0);
            }

            24% {
                transform: translate3d(var(--wobble-x, 0), var(--wobble-y, 0), 0);
            }

            48% {
                transform: translate3d(calc(var(--wobble-x, 0) * -0.46), calc(var(--wobble-y, 0) * -0.46), 0);
            }

            72% {
                transform: translate3d(calc(var(--wobble-x, 0) * 0.18), calc(var(--wobble-y, 0) * 0.18), 0);
            }

            100% {
                transform: translate3d(0, 0, 0);
            }
        }

        @keyframes liquidWordReflect {
            0% {
                color: inherit;
                filter: brightness(1) contrast(1);
                text-shadow: none;
            }

            22% {
                color: #11110f;
                filter: brightness(1.22) contrast(1.24);
                text-shadow:
                    0 -1px 0 rgba(255, 255, 255, 0.4),
                    0 1px 1px rgba(32, 32, 29, 0.18);
            }

            52% {
                color: #343128;
                filter: brightness(0.95) contrast(1.08);
                text-shadow:
                    0 1px 0 rgba(255, 255, 255, 0.18);
            }

            100% {
                color: inherit;
                filter: brightness(1) contrast(1);
                text-shadow: none;
            }
        }

        @media (max-width: 560px) {
            body {
                overflow: auto;
                padding: 18px 0;
            }

            .kindle {
                width: 100vw;
                min-height: 100vh;
                height: auto;
            }

            .reader-copy {
                display: block;
                height: 360px;
            }

            .status-title,
            .layout-stats {
                display: none;
            }

            .reading-footer {
                grid-template-columns: auto 1fr auto;
                gap: 10px;
            }

            .wheel-hint,
            .page-status span {
                display: none;
            }
        }
    </style>
</head>

            'FIAP - Faculdade de Informatica e Administracao Paulista | Software Development Technology / Computer Programming.',
            'Machine Learning - Coursera | SQL Server Training: Performance, Security, Data Migration, Indexes, Jobs | Microsoft ASP.NET Web Applications.',
            '',
            'LANGUAGES',
            'Portuguese | English',
        ].join('\n');

        // pretext.js needs the text, font, width, and line height. This wrapper keeps
        // the rich line-layout integration in one place so rendering can focus on motion.
        function measureWithPretext(text, fontSize, maxWidth) {
            const lineHeight = Math.round(fontSize * READER_LINE_HEIGHT);
            const prepared = prepareWithSegments(text, getReaderFont(fontSize), { whiteSpace: 'pre-wrap' });

            return {
                maxWidth,
                lineHeight,
                result: layoutWithLines(prepared, maxWidth, lineHeight),
            };
        }

        function measureInlinePrompt(maxWidth, visibleHeight) {
            const promptWidth = clamp(Math.round(maxWidth * 1.08), 320, 460);
            const prepared = prepareWithSegments(
                CAMERA_PROMPT_TEXT,
                `700 ${CAMERA_PROMPT_FONT_SIZE}px "Orbitron", Arial, Helvetica, sans-serif`,
                { whiteSpace: 'pre-wrap' }
            );
            const promptResult = layoutWithLines(
                prepared,
                promptWidth - CAMERA_PROMPT_PADDING_X * 2,
                CAMERA_PROMPT_LINE_HEIGHT
            );

            return {
                top: clamp(Math.round(visibleHeight * 0.24), 82, 146),
                width: promptWidth,
                height: promptResult.lines.length * CAMERA_PROMPT_LINE_HEIGHT + CAMERA_PROMPT_PADDING_Y * 2 + 18,
            };
        }

        // The camera reflection uses the existing measured resume words as the display
        // surface. We sample the live image at low resolution and lightly tint words
        // in place so the page stays readable while still carrying motion from the camera.
        function drawCameraReflectionFrame() {
            if (!cameraReflectionActive || cameraVideo.readyState < 2) {
                return;
            }

            const pageBounds = page.getBoundingClientRect();
            const sampleWidth = 120;
            const sampleHeight = 72;
            const visibleWords = readerText.querySelectorAll('.reader-word');

            cameraCanvas.width = sampleWidth;
            cameraCanvas.height = sampleHeight;
            cameraContext.save();
            cameraContext.translate(sampleWidth, 0);
            cameraContext.scale(-1, 1);
            cameraContext.drawImage(cameraVideo, 0, 0, sampleWidth, sampleHeight);
            cameraContext.restore();

            const { data } = cameraContext.getImageData(0, 0, sampleWidth, sampleHeight);
            const luminanceFrame = new Float32Array(sampleWidth * sampleHeight);

            for (let pixelIndex = 0; pixelIndex < data.length; pixelIndex += 4) {
                const red = data[pixelIndex];
                const green = data[pixelIndex + 1];
                const blue = data[pixelIndex + 2];
                luminanceFrame[pixelIndex / 4] = (red * 0.299 + green * 0.587 + blue * 0.114) / 255;
            }

            visibleWords.forEach((wordElement) => {
                const bounds = wordElement.getBoundingClientRect();
                const normalizedX = Math.min(1, Math.max(0, (bounds.left + bounds.width / 2 - pageBounds.left) / pageBounds.width));
                const normalizedY = Math.min(1, Math.max(0, (bounds.top + bounds.height / 2 - pageBounds.top) / pageBounds.height));
                const pixelX = Math.min(sampleWidth - 1, Math.max(0, Math.round(normalizedX * (sampleWidth - 1))));
                const pixelY = Math.min(sampleHeight - 1, Math.max(0, Math.round(normalizedY * (sampleHeight - 1))));
                const pixelIndex = (pixelY * sampleWidth + pixelX) * 4;
                const red = data[pixelIndex];
                const green = data[pixelIndex + 1];
                const blue = data[pixelIndex + 2];
                const luminanceIndex = pixelY * sampleWidth + pixelX;
                const luminance = luminanceFrame[luminanceIndex];
                const inverseLuminance = 1 - luminance;
                const contrastLuminance = Math.pow(inverseLuminance, 0.72);
                const leftX = Math.max(0, pixelX - 1);
                const rightX = Math.min(sampleWidth - 1, pixelX + 1);
                const topY = Math.max(0, pixelY - 1);
                const bottomY = Math.min(sampleHeight - 1, pixelY + 1);
                const leftLuminance = luminanceFrame[pixelY * sampleWidth + leftX];
                const rightLuminance = luminanceFrame[pixelY * sampleWidth + rightX];
                const topLuminance = luminanceFrame[topY * sampleWidth + pixelX];
                const bottomLuminance = luminanceFrame[bottomY * sampleWidth + pixelX];
                const gradientX = rightLuminance - leftLuminance;
                const gradientY = bottomLuminance - topLuminance;
                const edgeStrength = Math.min(1, Math.hypot(gradientX, gradientY) * 2.8);
                const previousLuminance = previousCameraLuminanceFrame ? previousCameraLuminanceFrame[luminanceIndex] : luminance;
                const motionStrength = Math.min(1, Math.abs(luminance - previousLuminance) * 10.5);
                const edgeDirectionLength = Math.hypot(gradientX, gradientY) || 1;
                const directionX = gradientX / edgeDirectionLength;
                const directionY = gradientY / edgeDirectionLength;
                const lineElement = wordElement.closest('.reader-line');
                const lineDamping = lineElement && lineElement.classList.contains('reader-line-heading')
                    ? 0.24
                    : lineElement && lineElement.classList.contains('reader-line-role')
                        ? 0.52
                        : lineElement && lineElement.classList.contains('reader-line-contact')
                            ? 0.42
                            : 1;
                const displacementStrength = Math.min(1, edgeStrength * (0.18 + motionStrength * 2.15));
                const maxDisplacement = 6.5;
                const shiftX = directionX * displacementStrength * maxDisplacement * lineDamping;
                const shiftY = directionY * displacementStrength * maxDisplacement * 0.82 * lineDamping;
                const mixedRed = Math.round(74 + red * 0.08 + contrastLuminance * 46);
                const mixedGreen = Math.round(71 + green * 0.1 + contrastLuminance * 42);
                const mixedBlue = Math.round(66 + blue * 0.06 + contrastLuminance * 38);
                const brightness = 0.92 + contrastLuminance * 0.16;
                const contrast = 1.18 + contrastLuminance * 0.42;
                const highlight = 0.08 + contrastLuminance * 0.14;
                const shadow = 0.22 + luminance * 0.36;
                const glow = 0.01 + contrastLuminance * 0.05;

                wordElement.classList.add('reader-word-camera-lit');
                wordElement.style.setProperty('--camera-word-color', `rgb(${mixedRed} ${mixedGreen} ${mixedBlue})`);
                wordElement.style.setProperty('--camera-word-brightness', brightness.toFixed(3));
                wordElement.style.setProperty('--camera-word-contrast', contrast.toFixed(3));
                wordElement.style.setProperty('--camera-word-highlight', highlight.toFixed(3));
                wordElement.style.setProperty('--camera-word-shadow', shadow.toFixed(3));
                wordElement.style.setProperty('--camera-word-glow', glow.toFixed(3));
                wordElement.style.setProperty('--camera-shift-x', `${shiftX.toFixed(2)}px`);
                wordElement.style.setProperty('--camera-shift-y', `${shiftY.toFixed(2)}px`);
            });

            previousCameraLuminanceFrame = luminanceFrame;
            cameraAnimationFrame = requestAnimationFrame(drawCameraReflectionFrame);
        }

        function clearCameraReflectionFromWords() {
            readerText.querySelectorAll('.reader-word').forEach((wordElement) => {
                wordElement.classList.remove('reader-word-camera-lit');
                wordElement.style.removeProperty('--camera-word-color');
                wordElement.style.removeProperty('--camera-word-brightness');
                wordElement.style.removeProperty('--camera-word-contrast');
                wordElement.style.removeProperty('--camera-word-highlight');
                wordElement.style.removeProperty('--camera-word-shadow');
                wordElement.style.removeProperty('--camera-word-glow');
                wordElement.style.removeProperty('--camera-shift-x');
                wordElement.style.removeProperty('--camera-shift-y');
            });
        }

        function showCameraInstruction() {
            cameraInstructionVisible = true;
            rebuildMeasuredPages();

            if (cameraInstructionTimeout) {
                clearTimeout(cameraInstructionTimeout);
            }

            cameraInstructionTimeout = window.setTimeout(() => {
                cameraInstructionVisible = false;
                rebuildMeasuredPages();
                cameraInstructionTimeout = 0;
            }, 4200);
        }

        async function startCameraReflection() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('Camera access is not supported in this browser.');
            }

            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 640 },
                    height: { ideal: 360 },
                },
                audio: false,
            });

            cameraVideo.srcObject = cameraStream;
            cameraVideo.playsInline = true;
            cameraVideo.muted = true;
            await cameraVideo.play();

            cameraReflectionActive = true;
            previousCameraLuminanceFrame = null;
            showCameraInstruction();
            drawCameraReflectionFrame();
        }

        function stopCameraReflection() {
            cameraReflectionActive = false;
            clearCameraReflectionFromWords();

            if (cameraInstructionTimeout) {
                clearTimeout(cameraInstructionTimeout);
                cameraInstructionTimeout = 0;
            }
            cameraInstructionVisible = false;

            if (cameraAnimationFrame) {
                cancelAnimationFrame(cameraAnimationFrame);
                cameraAnimationFrame = 0;
            }

            if (cameraStream) {
                cameraStream.getTracks().forEach((track) => track.stop());
                cameraStream = null;
            }

            cameraVideo.srcObject = null;
            previousCameraLuminanceFrame = null;
        }

        // Creates one absolutely positioned line. Absolute positioning lets the page
        // animate from one measured layout to another instead of relying on browser
        // paragraph wrapping, which would snap instantly.
        function createLineElement(line, index, lineHeight) {
            const lineElement = document.createElement('div');
            lineElement.className = 'reader-line';
            appendMeasuredWords(lineElement, line.text.trimEnd());
            lineElement.style.top = `${index * lineHeight}px`;
            applyResumeLineStyle(lineElement, line.text);

            return lineElement;
        }

        // Each measured line is split into word spans so the liquid click effect can
        // wobble nearby words individually while preserving the exact pretext.js line.
        function appendMeasuredWords(lineElement, text) {
            const parts = text.match(/\S+|\s+/g) || [''];

            parts.forEach((part) => {
                if (/^\s+$/.test(part)) {
                    lineElement.appendChild(document.createTextNode(part));
                    return;
                }

                const wordElement = document.createElement('span');
                const wordTextElement = document.createElement('span');
                wordElement.className = 'reader-word';
                wordTextElement.className = 'reader-word-text';
                wordTextElement.textContent = part;
                wordElement.appendChild(wordTextElement);
                lineElement.appendChild(wordElement);
            });
        }

        // pretext.js gives us plain measured line text. This helper adds resume-like
        // visual hierarchy back onto those measured lines without changing pagination.
        function applyResumeLineStyle(lineElement, text) {
            const trimmedText = text.trim();
            const sectionHeadings = new Set([
                'RAFAEL GOMES DOS SANTOS',
                'PROFESSIONAL SUMMARY',
                'CORE EXPERTISE',
                'SELECTED IMPACT',
                'PROFESSIONAL EXPERIENCE',
                'EARLIER EXPERIENCE',
                'EDUCATION AND TRAINING',
                'LANGUAGES',
            ]);

            if (sectionHeadings.has(trimmedText)) {
                lineElement.classList.add('reader-line-heading');
            } else if (
                trimmedText.startsWith('Tech Lead /') ||
                trimmedText.startsWith('Senior Software Engineer') ||
                trimmedText.startsWith('Software Developer /') ||
                trimmedText.startsWith('epay,')
            ) {
                lineElement.classList.add('reader-line-role');
            } else if (trimmedText.includes('@') || trimmedText.includes('linkedin.com')) {
                lineElement.classList.add('reader-line-contact');
            } else if (trimmedText === '') {
                lineElement.classList.add('reader-line-meta');
            }
        }

        function renderInlinePrompt(promptMetrics) {
            const promptElement = document.createElement('div');
            const promptLabel = document.createElement('strong');
            const promptBody = document.createElement('span');
            promptElement.className = 'reader-inline-prompt';
            promptElement.style.top = `${promptMetrics.top}px`;
            promptElement.style.width = `${promptMetrics.width}px`;
            promptElement.style.minHeight = `${promptMetrics.height}px`;
            promptLabel.textContent = CAMERA_PROMPT_LABEL;
            promptBody.textContent = CAMERA_PROMPT_TEXT;
            promptElement.append(promptLabel, promptBody);
            readerText.appendChild(promptElement);

            requestAnimationFrame(() => {
                promptElement.classList.add('reader-inline-prompt-visible');
            });
        }

        function applyPromptParting(columnElement, columnIndex, promptMetrics, lineHeight, animate) {
            const sideDirection = columnIndex === 0 ? -1 : 1;
            const horizontalPush = clamp(Math.round(promptMetrics.width * 0.18), 34, 62);
            const lowerShift = clamp(Math.round(promptMetrics.height * 0.3), 18, 34);
            const promptTop = promptMetrics.top;
            const promptBottom = promptMetrics.top + promptMetrics.height;
            const promptCenter = promptTop + promptMetrics.height / 2;
            const influenceRadius = promptMetrics.height * 1.4;
            const lowerInfluenceEnd = promptBottom + lineHeight * 3.4;

            columnElement.querySelectorAll('.reader-line').forEach((lineElement, lineIndex) => {
                const lineTop = lineIndex * lineHeight;
                const lineCenter = lineTop + lineHeight / 2;
                lineElement.classList.remove('reader-line-parted');
                lineElement.style.removeProperty('--part-delay');
                lineElement.style.transform = 'translate3d(0, 0, 0)';

                const distanceFromPrompt = Math.abs(lineCenter - promptCenter);
                const overlapStrength = Math.max(0, 1 - distanceFromPrompt / Math.max(1, influenceRadius));

                if (overlapStrength > 0.04) {
                    const insidePromptBand = lineCenter >= promptTop - lineHeight * 0.8 && lineCenter <= promptBottom + lineHeight * 0.8;
                    const bandBias = insidePromptBand ? 1 : 0.58;
                    const verticalDirection = lineCenter < promptCenter ? -1 : 1;
                    const shiftX = sideDirection * horizontalPush * overlapStrength * bandBias;
                    const shiftY = verticalDirection * Math.min(16, overlapStrength * 12) + (lineCenter > promptCenter ? overlapStrength * 8 : 0);
                    const delay = animate ? Math.round((1 - overlapStrength) * 120 + Math.abs(lineCenter - promptCenter) * 0.18 + columnIndex * 46) : 0;

                    lineElement.classList.add('reader-line-parted');
                    lineElement.style.setProperty('--part-delay', `${delay}ms`);

                    if (animate) {
                        requestAnimationFrame(() => {
                            lineElement.style.transform = `translate3d(${shiftX.toFixed(2)}px, ${shiftY.toFixed(2)}px, 0)`;
                        });
                    } else {
                        lineElement.style.transform = `translate3d(${shiftX.toFixed(2)}px, ${shiftY.toFixed(2)}px, 0)`;
                    }
                } else if (lineTop < lowerInfluenceEnd && lineTop > promptBottom - lineHeight) {
                    const settleRatio = Math.min(1, (lineTop - promptBottom) / Math.max(lineHeight * 3.4, 1));
                    const shiftY = lowerShift * (1 - settleRatio * 0.72);
                    const shiftX = sideDirection * horizontalPush * 0.18 * (1 - settleRatio);
                    const delay = animate ? Math.round(170 + Math.min(120, settleRatio * 130) + columnIndex * 46) : 0;

                    lineElement.style.setProperty('--part-delay', `${delay}ms`);

                    if (animate) {
                        requestAnimationFrame(() => {
                            lineElement.style.transform = `translate3d(${shiftX.toFixed(2)}px, ${shiftY.toFixed(2)}px, 0)`;
                        });
                    } else {
                        lineElement.style.transform = `translate3d(${shiftX.toFixed(2)}px, ${shiftY.toFixed(2)}px, 0)`;
                    }
                }
            });
        }

        // Redraws the current measured spread without transition effects. Each column
        // is treated as its own page, so a desktop spread shows two real pages at once.
        function renderMeasuredSpread(lineHeight) {
            const incomingFragment = document.createDocumentFragment();

            for (let columnIndex = 0; columnIndex < currentColumnCount; columnIndex++) {
                const columnElement = document.createElement('div');
                columnElement.className = 'reader-column';
                const columnPage = currentPages[pageIndex + columnIndex] || [];

                columnPage.forEach((line, index) => {
                    columnElement.appendChild(createLineElement(line, index, lineHeight));
                });

                incomingFragment.appendChild(columnElement);
            }

            readerText.replaceChildren();
            readerText.appendChild(incomingFragment);
            currentLines = currentPages.slice(pageIndex, pageIndex + currentColumnCount).flat();

            if (cameraInstructionVisible && pageIndex === 0) {
                const promptMetrics = measureInlinePrompt(currentColumnWidth || 280, readerText.getBoundingClientRect().height);
                const visibleColumns = Array.from(readerText.querySelectorAll('.reader-column'));
                visibleColumns.forEach((columnElement, columnIndex) => {
                    applyPromptParting(columnElement, columnIndex, promptMetrics, lineHeight, true);
                });
                renderInlinePrompt(promptMetrics);
            }

            if (cameraReflectionActive) {
                clearCameraReflectionFromWords();
            }
        }

        // Paints the footer from measured pagination state. The progress bar now comes
        // from the visible page spread, making it a real reading position.
        function updateReaderChrome(linesPerPage) {
            const pageCount = currentPages.length;
            const lastVisiblePageIndex = Math.min(pageIndex + currentColumnCount - 1, pageCount - 1);
            const pageLabelText = pageIndex === lastVisiblePageIndex
                ? `Page ${pageIndex + 1} of ${pageCount}`
                : `Pages ${pageIndex + 1}-${lastVisiblePageIndex + 1} of ${pageCount}`;
            const spreadLabel = currentColumnCount > 1 ? '2-page spread' : '1-page view';

            zoomValue.textContent = `${getZoomPercent(READER_SIZES[sizeIndex])}%`;
            pageLabel.textContent = pageLabelText;
            layoutStats.textContent = `${linesPerPage} lines/page / ${spreadLabel}`;
            locationLabel.textContent = `Loc ${getLocation(READER_SIZES[sizeIndex], pageIndex * linesPerPage + 1)}`;
            root.style.setProperty('--progress', `${getPageProgressPercent(lastVisiblePageIndex, pageCount)}%`);

            zoomOut.disabled = sizeIndex === 0;
            zoomIn.disabled = sizeIndex === READER_SIZES.length - 1;
            previousPage.disabled = pageIndex === 0;
            nextPage.disabled = lastVisiblePageIndex === pageCount - 1;
        }

        // Rebuilds all pages from measured pretext.js lines. Zooming and resizing call
        // this because both actions can change line wrapping and therefore page count.
        function rebuildMeasuredPages() {
            const fontSize = READER_SIZES[sizeIndex];
            root.style.setProperty('--reader-size', `${fontSize}px`);

            // Measure after the CSS variable has painted, matching what the reader actually sees.
            requestAnimationFrame(() => {
                try {
                    const readerBounds = readerText.getBoundingClientRect();
                    const computedStyle = window.getComputedStyle(readerText);
                    const columnGap = Number.parseFloat(computedStyle.columnGap) || 0;
                    currentColumnCount = window.matchMedia('(max-width: 560px)').matches ? 1 : 2;
                    const maxWidth = Math.round((readerBounds.width - columnGap * (currentColumnCount - 1)) / currentColumnCount);
                    currentColumnWidth = maxWidth;
                    const visibleHeight = readerBounds.height;
                    const measurement = measureWithPretext(resumeSourceText, fontSize, maxWidth);
                    currentLinesPerColumn = Math.max(1, Math.floor(visibleHeight / measurement.lineHeight));
                    const linesPerPage = currentLinesPerColumn;
                    currentPages = paginateLines(measurement.result.lines, linesPerPage);
                    pageIndex = Math.min(pageIndex, currentPages.length - 1);
                    pageIndex = Math.max(0, pageIndex - (pageIndex % currentColumnCount));

                    updateReaderChrome(linesPerPage);

                    renderMeasuredSpread(measurement.lineHeight);
                } catch (error) {
                    console.error('Unable to measure Kindle reader text with pretext.js.', error);
                    layoutStats.textContent = 'Measure error';
                }
            });
        }

        // The small A moves to the previous allowed zoom stop.
        zoomOut.addEventListener('click', () => {
            sizeIndex = getNextSizeIndex(sizeIndex, -1);
            pageIndex = 0;
            rebuildMeasuredPages();
        });

        // The large A moves to the next allowed zoom stop.
        zoomIn.addEventListener('click', () => {
            sizeIndex = getNextSizeIndex(sizeIndex, 1);
            pageIndex = 0;
            rebuildMeasuredPages();
        });

        // Mouse wheel zoom uses the same discrete stops as the Aa controls. A small
        // throttle prevents high-resolution trackpads from jumping through many sizes
        // in a single gesture.
        screen.addEventListener('wheel', (event) => {
            event.preventDefault();

            const now = performance.now();
            if (now - lastWheelZoomAt < 160 || Math.abs(event.deltaY) < 6) {
                return;
            }

            const direction = event.deltaY < 0 ? 1 : -1;
            const nextSizeIndex = getNextSizeIndex(sizeIndex, direction);

            if (nextSizeIndex !== sizeIndex) {
                sizeIndex = nextSizeIndex;
                pageIndex = 0;
                rebuildMeasuredPages();
            }

            lastWheelZoomAt = now;
        }, { passive: false });

        // Previous and next move across measured page slices. There is no scroll jump
        // because each page is rendered from an exact line range returned by pretext.js.
        previousPage.addEventListener('click', () => {
            pageIndex = Math.max(0, pageIndex - currentColumnCount);
            rebuildMeasuredPages();
        });

        nextPage.addEventListener('click', () => {
            pageIndex = Math.min(currentPages.length - 1, pageIndex + currentColumnCount);
            rebuildMeasuredPages();
        });

        // A click on the reading surface behaves like tapping water: a visual ripple
        // expands from the pointer, and nearby measured word spans wobble with a
        // distance-based delay so the wave appears to travel outward.
        screen.addEventListener('click', (event) => {
            if (event.target.closest('button')) {
                return;
            }

            const screenBounds = screen.getBoundingClientRect();
            const clickX = event.clientX;
            const clickY = event.clientY;

            screen.style.setProperty('--ripple-x', `${clickX - screenBounds.left}px`);
            screen.style.setProperty('--ripple-y', `${clickY - screenBounds.top}px`);
            screen.classList.remove('screen-rippling');
            void screen.offsetWidth;
            screen.classList.add('screen-rippling');

            document.querySelectorAll('.reader-word').forEach((wordElement) => {
                const wordBounds = wordElement.getBoundingClientRect();
                const wordX = wordBounds.left + wordBounds.width / 2;
                const wordY = wordBounds.top + wordBounds.height / 2;
                const deltaX = wordX - clickX;
                const deltaY = wordY - clickY;
                const distance = Math.hypot(deltaX, deltaY);

                if (distance > LIQUID_WAVE_RADIUS) {
                    return;
                }

                const falloff = 1 - distance / LIQUID_WAVE_RADIUS;
                const angle = Math.atan2(deltaY, deltaX);
                const strength = LIQUID_WAVE_STRENGTH * falloff;

                const wordTextElement = wordElement.querySelector('.reader-word-text');
                wordElement.classList.remove('reader-word-wobble');
                wordTextElement.classList.remove('reader-word-text-reflect');
                wordElement.style.setProperty('--wobble-x', `${Math.cos(angle) * strength}px`);
                wordElement.style.setProperty('--wobble-y', `${Math.sin(angle) * strength * 0.62}px`);
                wordElement.style.setProperty('--wobble-delay', `${Math.round(distance * 0.85)}ms`);
                void wordElement.offsetWidth;
                wordElement.classList.add('reader-word-wobble');
                wordTextElement.classList.add('reader-word-text-reflect');
            });
        });

        // Width changes affect wrapping, so a resize needs a fresh pretext.js measure.
        window.addEventListener('resize', rebuildMeasuredPages);
        window.addEventListener('beforeunload', stopCameraReflection);

        // Initial measurement replaces the placeholder footer text after the module loads.
        rebuildMeasuredPages();

        // Ask for the camera immediately so the reflection can feel native to the page.
        // If permission is denied, the reader still works normally without the effect.
        startCameraReflection().catch((error) => {
            console.warn('Unable to start the live camera reflection.', error);
            stopCameraReflection();
        });
    </script>
</body>
</html>
